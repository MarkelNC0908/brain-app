# Al subir una etiqueta v* (por ejemplo v1.0.14) compila los tres zips de escritorio en cada sistema real, ejecuta las pruebas en los tres y deja un release BORRADOR
# con los zips, sus .sha256 y notas generadas. Tú lo revisas, añades el APK si quieres (se compila aparte) y lo publicas.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node node_modules/electron/install.js
      - name: Prueba de arranque (Linux, con pantalla virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run humo
      - name: Prueba de arranque
        if: runner.os != 'Linux'
        run: npm run humo
  compilar:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, script: build, carpeta: Brain-darwin-arm64, zip: Brain-macos-arm64.zip }
          - { os: windows-latest, script: 'build:win', carpeta: Brain-win32-x64, zip: Brain-windows-x64.zip }
          - { os: ubuntu-latest, script: 'build:linux', carpeta: Brain-linux-x64, zip: Brain-linux-x64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: La versión de package.json debe coincidir con la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e "const v=require('./package.json').version, t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(v!==t){console.error('package.json dice '+v+' y la etiqueta '+t);process.exit(1)}"
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Dar permiso de ejecución al ayudante de la terminal (node-pty)
        if: runner.os != 'Windows'
        shell: bash
        run: find dist -name spawn-helper -type f -exec chmod +x {} +
      - name: Comprimir (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent "${{ matrix.carpeta }}" "../${{ matrix.zip }}"
      - name: Comprimir (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -qry "../${{ matrix.zip }}" "${{ matrix.carpeta }}"
      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.carpeta }}" -DestinationPath "${{ matrix.zip }}"
      - name: Comprobar que el ayudante de la terminal sale ejecutable en el zip
        if: runner.os != 'Windows'
        shell: bash
        run: |
          L=$(unzip -Z "${{ matrix.zip }}" | grep 'spawn-helper$' || true)
          echo "$L"
          [ -n "$L" ] || { echo 'No hay spawn-helper en el zip'; exit 1; }
          if echo "$L" | grep -q '^-rw-'; then echo 'spawn-helper sin permiso de ejecución en el zip'; exit 1; fi
      - name: Hash sha256
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.zip }}" > "${{ matrix.zip }}.sha256"; else shasum -a 256 "${{ matrix.zip }}" > "${{ matrix.zip }}.sha256"; fi
          cat "${{ matrix.zip }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: |
            ${{ matrix.zip }}
            ${{ matrix.zip }}.sha256
          if-no-files-found: error
  borrador:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Crear (o completar) el release borrador
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" salida/* --clobber
          else
            EXTRA=""; case "$TAG" in *-*) EXTRA="--prerelease";; esac   # etiquetas como v1.0.14-rc1 son de prueba
            gh release create "$TAG" salida/* --draft $EXTRA --title "Brain ${TAG#v}" --generate-notes
          fi
