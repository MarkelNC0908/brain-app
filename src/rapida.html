<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';">
<title>Captura rápida</title><link rel="stylesheet" href="style.css">
<style>html,body{background:var(--bg)!important;height:100%}body{padding:14px;box-sizing:border-box}#r{display:flex;flex-direction:column;gap:8px;height:100%}#r textarea{flex:1;resize:none;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--hover);color:var(--fg);font:inherit}#r .f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#r select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}#r button{border:0;border-radius:8px;padding:7px 14px;background:var(--acc);color:#fff;cursor:pointer;font:inherit}#r .m{color:var(--mut);font-size:12px}</style></head>
<body><div id="r"><div class="f"><b>⚡ Captura rápida</b><span class="m">Cmd/Ctrl+Intro guarda · Esc cierra</span></div>
<textarea id="t" placeholder="Una idea, una duda, algo que apuntar…" autofocus></textarea>
<div class="f"><label><input type="radio" name="k" value="duda" checked> ❓ Duda</label><label><input type="radio" name="k" value="apunte"> 📝 Apunte rápido</label><select id="s"></select><button id="g">Guardar</button></div>
<div class="m" id="m"></div></div><script src="rapida-ui.js"></script></body></html>
